name: Modrinth release
on: 
  push:
    tags:
      - '*'
jobs:
  zip:
    runs-on: ubuntu-latest
    if: ${{github.ref_type == 'tag'}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: src
      - name: Get Branch
        id: get_branch
        run: |
          cd src
          tag=${{github.ref_name}}
          echo "tag=$tag" >> $GITHUB_ENV
          echo "name=more-trim-materials" >> $GITHUB_ENV
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.name}}-${{env.tag}}
          path: src
      - name: Create datapack zip file
        run: zip -r ${{env.name}}-${{env.tag}}.zip . -x ".git/*" ".github/*" ".gitattributes" "supported_versions.txt" "assets/*" "overlay_48/*" "overlay_48_2/*" "overlay_65/*" "overlay_68/*" "overlay_68_2/*" "overlay_73/*" "overlay_89/*"
        working-directory: src
      - name: Create resourcepack zip file
        run: zip -r ${{env.name}}-${{env.tag}}-resourcepack.zip . -x ".git/*" ".github/*" ".gitattributes" "supported_versions.txt" "data/*" "overlay_63/*" "overlay_64/*" "overlay_64_2/*" "overlay_108/*"
        working-directory: src
      - name: Read supported versions
        uses: andstor/file-reader-action@v1
        id: read_file
        with:
          path: src/supported_versions.txt
      - name: Upload to modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{secrets.ACCESS_TOKEN}}
          project: gvHzqCpP
          name: More Trim Materials ${{env.tag}}
          version: ${{env.tag}}
          files: '["src/${{env.name}}-${{env.tag}}.zip", "src/${{env.name}}-${{env.tag}}-resourcepack.zip"]'
          primary-file: ${{env.name}}-${{env.tag}}.zip
          file-types: '{"${{env.name}}-${{env.tag}}-resourcepack.zip": "required-resource-pack"}'
          game-versions: ${{steps.read_file.outputs.contents}}
          loaders: datapack